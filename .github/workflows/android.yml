# ══════════════════════════════════════════════════════════════
#  经师 AI · Android 云构建（GitHub Actions）
# ══════════════════════════════════════════════════════════════
#
#  为什么用云构建：
#    本地无需安装 JDK / Android SDK / Android Studio。
#    GitHub 的 ubuntu-latest runner 已预装 Android SDK，配合
#    actions/setup-java 装好 JDK 21 即可完整构建。
#
#  ┌────────────────────────────────────────────────────────┐
#  │ 产物在哪                                                │
#  │  Actions → 选一次运行 → 页面底部 Artifacts 区下载 APK     │
#  └────────────────────────────────────────────────────────┘
#
#  ┌────────────────────────────────────────────────────────┐
#  │ 两个 Job 的区别                                          │
#  │  debug   : 自动运行。用 Android 默认调试签名，可直接装机    │
#  │            （仅用于自测，**不能上架**）                    │
#  │  release : 需手动勾选才运行。使用你自己的签名，才能上架        │
#  │            需要先配置 4 个 Secrets（见文件末尾说明）        │
#  └────────────────────────────────────────────────────────┘
#
#  ⚠️ 版本约束（改动前请读）：
#    · JDK 21  —— Capacitor 8 / AGP 8.13 的最低要求，用 17 会编译失败
#    · Android SDK Platform 36 —— 对应 compileSdk/targetSdk 36
#    · Node 22 —— Vite 8 要求 Node ≥ 20.19；22 是当前 LTS
#    这三者与 app/android/variables.gradle 中的配置强绑定，
#    若将来升级 Capacitor，需同步调整。

name: Build Android APK

on:
  # 手动触发（日常用这个）
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 release 包（需已配置签名 Secrets）'
        type: boolean
        default: false

  # 推送到 main 时自动构建，但仅当应用代码有变化时
  # （避免只改 PRD 文档也触发一次 4 分钟的构建）
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/public/**'
      - 'app/android/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/vite.config.ts'
      - 'app/capacitor.config.ts'
      - '.github/workflows/android.yml'

# 同一分支的新构建自动取消旧的，避免排队浪费额度
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════
  #  Debug 包：零配置，直接可用
  # ══════════════════════════════════════════════════════════
  debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        # runner 预装的 platform 版本可能不含 36，显式安装以保证稳定
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
        working-directory: .

      # ── 以下三步与本地开发完全一致，保证「本地能过 → CI 也能过」──

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查与单测（构建前置闸门）
        # ⚠️ 放在构建前：类型错误或单测失败时**不要**产出 APK，
        #    否则会得到一个"能装但可能是坏的"包，比构建失败更危险
        run: |
          npm run typecheck
          npm test

      - name: 构建 Web 产物
        run: npm run build

      - name: 同步到原生工程
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jingshi-ai-debug-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 构建摘要
        run: |
          {
            echo "## ✅ Debug APK 构建成功"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 包名 | \`cn.jingshi.ai\` |"
            echo ""
            echo "APK 请在本次运行的 **Artifacts** 区下载。"
            echo ""
            echo "> ⚠️ Debug 包仅供自测，不可上架。上架请用 release 包。"
          } >> $GITHUB_STEP_SUMMARY
        working-directory: .

  # ══════════════════════════════════════════════════════════
  #  Release 包：需签名，勾选后才运行
  # ══════════════════════════════════════════════════════════
  release:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    needs: debug
    if: ${{ inputs.build_release == true }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
        working-directory: .

      - name: 校验签名 Secrets 是否齐备
        # 缺 Secret 时给出**明确的操作指引**，而不是让 gradle 抛出难懂的报错
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS_BASE64" ]     && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASSWORD" ]   && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]     && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]  && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 Secrets：$missing"
            echo "请在仓库 Settings → Secrets and variables → Actions 中补齐后重试。"
            echo "生成方法见 .github/SIGNING.md"
            exit 1
          fi
          echo "✅ 签名 Secrets 齐备"
        working-directory: .

      - name: 还原签名文件
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KS_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✅ 签名文件已就位（构建后随 job 一起销毁）"

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查与单测
        run: |
          npm run typecheck
          npm test

      - name: 构建 Web 产物
        run: npm run build

      - name: 同步到原生工程
        run: npx cap sync android

      - name: 构建 Release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jingshi-ai-release-${{ github.sha }}
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  #  Release 签名配置说明
  # ══════════════════════════════════════════════════════════
  #
  #  ① 本地生成签名（只需一次，⚠️ keystore 文件务必长期妥善保存 ——
  #     丢失后无法再发布该应用的更新，只能换包名重新开始）：
  #
  #     keytool -genkeypair -v \
  #       -keystore release.keystore \
  #       -alias jingshi \
  #       -keyalg RSA -keysize 2048 -validity 10000
  #
  #  ② 转成 base64（用于存进 Secret）：
  #     Linux/macOS:  base64 -w0 release.keystore
  #     Windows Git Bash: base64 -w0 release.keystore
  #
  #  ③ 在仓库 Settings → Secrets and variables → Actions 添加 4 个 Secret：
  #     ANDROID_KEYSTORE_BASE64    ← 第 ② 步的输出
  #     ANDROID_KEYSTORE_PASSWORD  ← 生成时的 store 密码
  #     ANDROID_KEY_ALIAS          ← 上例为 jingshi
  #     ANDROID_KEY_PASSWORD       ← 生成时的 key 密码
  #
  #  ④ 在 android/app/build.gradle 中接入 signingConfigs（见该文件注释）
