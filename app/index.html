<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2B5CE6" />
    <meta name="description" content="科学计划 + 全真模考 + AI 私教，帮你一次通过中级经济师" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="经济师上岸助手" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>经济师上岸助手</title>

    <!--
      ══════════════════════════════════════════════════════════════
      启动界面样式（内联，必须留在 HTML 里）
      ══════════════════════════════════════════════════════════════
      ⚠️ 这段样式**不要移到外部 CSS**，也不要改成需要构建的写法。

      原因：App 启动时需要先初始化数据源（SQLite WASM 加载 + 建表 +
      灌题库），Vue 要等它完成后才挂载 —— 在手机上这可能要好几秒。
      在那之前 `#app` 是空的，用户看到的就是**一片空白**，会以为 App 坏了。

      把启动界面写成「静态 HTML + 内联样式」，它就能在**不依赖任何 JS、
      不等待任何网络请求**的情况下立刻渲染出来。

      挂载时 Vue 会清空 `#app` 的内容，启动界面自然消失。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        color: #1a1a1a;
        padding: 0 32px;
        box-sizing: border-box;
      }
      #boot-screen .boot__logo {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #2b5ce6;
      }
      #boot-screen .boot__spinner {
        width: 26px;
        height: 26px;
        border: 2.5px solid #e8ecf5;
        border-top-color: #2b5ce6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-screen .boot__tip {
        font-size: 13px;
        color: #646566;
        text-align: center;
        line-height: 1.6;
        max-width: 300px;
      }
      /* 启动失败提示：默认隐藏，失败时由 main.ts 显示 —— 绝不让用户面对空白 */
      #boot-screen .boot__error {
        display: none;
        font-size: 12px;
        color: #c8342b;
        text-align: left;
        line-height: 1.6;
        max-width: 320px;
        word-break: break-all;
        background: #fdf2f1;
        border-radius: 8px;
        padding: 10px 12px;
        max-height: 40vh;
        overflow: auto;
      }
      @media (prefers-color-scheme: dark) {
        #boot-screen {
          background: #121212;
          color: #e8e8e8;
        }
        #boot-screen .boot__tip {
          color: #9a9a9a;
        }
        #boot-screen .boot__spinner {
          border-color: #2a2f3a;
          border-top-color: #5b8cff;
        }
        #boot-screen .boot__error {
          background: #2a1a19;
          color: #ff8a80;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 启动界面：静态渲染，不依赖 JS。Vue 挂载时会被自动清空。 -->
      <div id="boot-screen">
        <div class="boot__logo">经济师上岸助手</div>
        <div class="boot__spinner"></div>
        <div class="boot__tip" id="boot-tip">正在准备你的学习数据…</div>
        <div class="boot__error" id="boot-error"></div>
      </div>
    </div>

    <!--
      ══════════════════════════════════════════════════════════════
      启动自检（⚠️ 必须是普通脚本，不能加 type="module"）
      ══════════════════════════════════════════════════════════════
      用途只有一个：**当应用代码没能跑起来时，说清楚是为什么。**

      为什么需要它：如果主模块（/src/main.ts）因为设备 WebView 版本过低
      等原因解析失败，主模块**一行都不会执行** —— 错误浮层、超时兜底
      全都不会生效，用户只能看到一个永远停在初始文案的启动页，
      完全无法判断出了什么事。

      普通脚本不受模块解析失败影响，所以能承担这个职责：
        ① 每秒更新等待秒数 —— 能证明页面本身是活的（不是整机卡死）
        ② 超过宽限期仍未启动 → 直接显示设备 WebView 版本，定位兼容性问题

      主模块启动后会设置 window.__appBooted = true，本脚本随即停止干预。
    -->
    <script>
      ;(function () {
        var startAt = Date.now()
        var GRACE_MS = 8000
        var tip = document.getElementById('boot-tip')
        var box = document.getElementById('boot-error')

        window.setInterval(function () {
          if (window.__appBooted) return
          var sec = Math.floor((Date.now() - startAt) / 1000)

          if (sec * 1000 < GRACE_MS) {
            if (tip) tip.textContent = '正在加载应用代码…（已等待 ' + sec + ' 秒）'
            return
          }

          if (tip) tip.textContent = '应用代码未能启动'
          if (!box || box.style.display === 'block') return

          var ua = navigator.userAgent || ''
          var chrome = (ua.match(/Chrome\/[\d.]+/) || ['Chrome/未知'])[0]
          var android = (ua.match(/Android [\d.]+/) || ['Android 未知'])[0]
          box.style.display = 'block'
          box.textContent =
            '应用代码在 ' + GRACE_MS / 1000 + ' 秒内没有启动。\n\n' +
            '最常见原因：设备 WebView 版本过低。\n' +
            '更新方法：设置 → 应用管理 → Android System WebView → 更新\n\n' +
            '诊断信息（反馈时请连同这行一起截图）：\n' +
            android + '　' + chrome + '\n' +
            ua
        }, 1000)
      })()
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
